<!--
THESIS: The site keeps Palestine's clock and Palestine's light. One day told in order, each part in the light it happened in; it refuses the latest-first feed and the static cream broadsheet.
OWN-WORLD: Palestinian limestone lit by the hour, as the sky really runs (violet dawn and blue hour before the sun is up, rose at sunrise and sunset, white noon, honey afternoon, night #0E1120), blended continuously down the page; shadow ink #15182A; one reserved sun colour that moves red to gold with altitude. Piazzolla for people, Archivo for the sun's instruments. Stories strung like beads on the sun's real path; hairlines and leader lines, no cards, no badges.
STORY: A reader anywhere sees what time and light it is in Palestine, reads the day from first light to night, and leaves knowing what happened and on whose word.
FIRST VIEWPORT: live sun strip; wordmark whose full stop sits at the sun's real altitude; lead headline left, archive photo right; the Day Dial full width beneath, slots strung on the sun's path with leader lines to the running order.
FORM: Palestine Time, brief-pinned (grounded list position 2), seed c313c97c.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
